plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mustansir.altitude'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mustansir.altitude'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    sourceSets {
        main {
            assets.srcDirs += ['../../dist']
        }
    }
}
